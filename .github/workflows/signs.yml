name: signs
# Official sign artwork from Wikimedia Commons.
#   push with "[discover-signs]"          -> discover (read-only, results in the log)
#   push with "[fetch-signs]" in message -> download the files chosen in kb/signs.json and commit them
on:
  push:
    branches: [signs]
permissions:
  contents: read
jobs:
  discover:
    if: contains(github.event.head_commit.message, '[discover-signs]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/commons-signs.mjs discover
        env:
          SHOW: "road sign 305.svg,road sign 311-,road sign 330,road sign 404,road sign 405,road sign 207-,road sign 208,road sign 406.svg,road sign 407-A,road sign 326-A,road sign 329-A,road sign 105-A"
          EXTRA: "left turn japan traffic signal;左折可 標示板;japan traffic light left arrow board"
  fetch:
    if: contains(github.event.head_commit.message, '[fetch-signs]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/commons-signs.mjs fetch
      - name: Commit fetched sign files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signs kb/signs.json
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Add official sign artwork from Wikimedia Commons (fetched in CI)"
          git push
