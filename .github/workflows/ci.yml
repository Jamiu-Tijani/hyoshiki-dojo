name: ci
on:
  push:
    branches: [main, rebuild, signs, ch2-paths, react-migration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Knowledge base check
        run: npm run kb:check
      - name: Typecheck
        run: npm run typecheck
      - name: Logic tests (src/logic against the old game's recorded decisions)
        run: npm run test:logic
      - name: App unit tests (routing)
        run: npm run test:app
      - name: Build
        run: npm run build
      - name: Bundle report
        run: |
          echo "### Bundle" >> $GITHUB_STEP_SUMMARY
          echo '| file | raw KB | gzip KB |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|---|' >> $GITHUB_STEP_SUMMARY
          for f in dist/engine/*.js dist/app/assets/*.js; do echo "| $(basename $f) | $(( $(wc -c <$f)/1024 )) | $(( $(gzip -9 -c $f | wc -c)/1024 )) |" | tee -a $GITHUB_STEP_SUMMARY; done
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: End-to-end (built site over http, engine expected)
        run: |
          python -m http.server 4173 --directory dist >/dev/null 2>&1 &
          sleep 1
          HD_URL=http://127.0.0.1:4173/ HD_EXPECT_ENGINE=1 python tests/e2e.py
      - name: End-to-end (SVG fallback, engine disabled)
        run: |
          python -m http.server 4174 --directory dist >/dev/null 2>&1 &
          sleep 1
          HD_URL=http://127.0.0.1:4174/ python tests/e2e.py --no-engine
      - name: React app smoke (dist/app)
        run: |
          python -m http.server 4175 --directory dist >/dev/null 2>&1 &
          sleep 1
          HD_URL=http://127.0.0.1:4175/ python tests/app_smoke.py

  # Publishes dist/ to GitHub Pages on pushes to main.
  # Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
