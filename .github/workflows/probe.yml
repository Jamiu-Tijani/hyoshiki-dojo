name: probe
on:
  push:
    branches: [ci-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --version && npm view pixi.js version && npm view gsap version
      - run: node tools/build-kb.mjs --check
