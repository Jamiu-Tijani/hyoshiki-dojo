<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyōshiki Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="assets/signs/tomare.svg" width="38" height="38" alt="" aria-hidden="true">
      <h1>Hyōshiki Dojo</h1>
      <button class="btn small hbtn" id="sound-btn" type="button" aria-pressed="true">Sound on</button>
      <button class="btn small" id="history-btn" type="button" aria-pressed="false">History</button>
    </div>
    <div class="chapter" id="chapter-line"></div>
  </header>

  <nav class="chapters" id="chapters" aria-label="Chapters"></nav>
  <nav class="tabs" role="tablist" id="tabs"></nav>

  <main class="card" id="card" aria-live="polite"></main>

  <footer>
    <div id="sources-intro"><b>Sources.</b> Every answer cites the section it comes from. Check anything doubtful against your school textbook, which is the tiebreaker.</div>
    <ul id="sources"></ul>
    <div>Sign images: official designs from <a href="https://commons.wikimedia.org/wiki/Category:Road_signs_of_Japan" target="_blank" rel="noopener">Wikimedia Commons</a> (public domain); sources listed in <code>kb/signs.json</code>.</div>
  </footer>
</div>
<script src="js/kb.js"></script>
<script src="js/track.js"></script>
<script src="js/render.js"></script>
<script src="levels/ch1.js"></script>
<script src="levels/ch2.js"></script>
<script src="levels/bonus.js"></script>
<script src="js/game.js"></script>
</body>
</html>
